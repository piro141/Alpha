<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --bg:#faf7f1; --type:#3d96bd; }
  body{
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  .wrap{max-width:480px;margin:0 auto;background:#faf7f1;}
  .b{display:block;width:100%;height:auto;margin:0;vertical-align:top;}
  .cta{padding:26px 20px 34px;text-align:center;}
  .cta:last-of-type{padding-bottom:calc(46px + env(safe-area-inset-bottom));}
  .btn{
    display:block;width:100%;
    background:var(--type);
    color:#fff;text-decoration:none;
    font-size:17px;font-weight:800;letter-spacing:.02em;
    padding:19px 12px;border-radius:999px;
    box-shadow:0 6px 18px rgba(61,150,189,.28);
  }
  .btn:active{transform:scale(.97);}
  .fallback{font-size:11.5px;color:#8a8f9c;margin-top:12px;line-height:1.8;}
  @media (max-width:360px){ .btn{font-size:15.5px;} }
</style>
</head>
<body>

<div class="wrap">

  <!-- FV＋診断結果: タイプ別（1枚に連結済み） -->
  <img class="b" id="imgFv" src="" alt="">

  <!-- 転換のチェック -->
  <img class="b" src="./img/block_check.jpg" alt="">

  <!-- 3つの問題 -->
  <img class="b" src="./img/block_prob1.jpg" alt="">
  <img class="b" src="./img/block_prob2.jpg" alt="">
  <img class="b" src="./img/block_prob3.jpg" alt="">

  <!-- そこで！ -->
  <img class="b" src="./img/block_soshite.jpg" alt="">

  <!-- CTA 1 -->
  <div class="cta">
    <a class="btn cta-btn" href="#" onclick="trackApply()">無料でフリーランスの個別診断を受ける ▶</a>
  </div>

  <!-- 受けた方の声 -->
  <img class="b" src="./img/voice_h.jpg" alt="">
  <img class="b" src="./img/voice1.jpg" alt="">
  <img class="b" src="./img/voice2.jpg" alt="">
  <img class="b" src="./img/voice3.jpg" alt="">
  <img class="b" src="./img/voice4.jpg" alt="">
  <img class="b" src="./img/voice5.jpg" alt="">

  <!-- CTA 2 -->
  <div class="cta">
    <a class="btn cta-btn" href="#" onclick="trackApply()">無料でフリーランスの個別診断を受ける ▶</a>
  </div>

  <!-- 悩み -->
  <img class="b" src="./img/block_worry.jpg" alt="">

  <!-- 締め -->
  <img class="b" src="./img/block_closing.jpg" alt="">

  <!-- CTA 3 -->
  <div class="cta">
    <a class="btn cta-btn" href="#" onclick="trackApply()">無料でフリーランスの個別診断を受ける ▶</a>
    <p class="fallback">うまく開かない場合は、このトークに「予約」と送ってください。</p>
  </div>

</div>

<script>
/* 申し込みの飛び先。ハーネスの計測用リンクを経由して予約画面へ飛ばす。
   経由させると「行動_予約画面へ進んだ」のタグが自動で付く */
const APPLY_URL = "https://line-harness.alpha-a.workers.dev/t/e52d31fb-7119-464c-b72b-ec800a5218ae";

const TYPES = {
  craft:   {name:"こつこつ積み上げる職人",       color:"#3d96bd"},
  create:  {name:"思いついた日に動ける開拓者",   color:"#d9962e"},
  support: {name:"言葉になる前に気づける支え手", color:"#3aa87f"},
  attack:  {name:"自分から動ける先行者",         color:"#e07a63"}
};

function render(){
  const key = new URLSearchParams(location.search).get("type");
  const k = TYPES[key] ? key : "craft";
  const t = TYPES[k];

  document.documentElement.style.setProperty("--type", t.color);
  document.getElementById("imgFv").src = "./img/fv_" + k + ".jpg";
  document.getElementById("imgFv").alt = t.name;

  const btns = document.querySelectorAll(".cta-btn");
  for (let i = 0; i < btns.length; i++) btns[i].href = APPLY_URL;

  if (typeof fbq === "function") fbq("trackCustom", "ViewResultLP", {type: k});
  if (typeof clarity === "function") clarity("set", "result_type", k);
}

function trackApply(){
  if (typeof fbq === "function") fbq("trackCustom", "ClickApply");
}

render();
</script>
</body>
</html>

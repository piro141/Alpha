<script>
/* 申し込みの飛び先。ハーネスの計測用リンクを経由して予約画面へ飛ばす。
   経由させると「行動_予約画面へ進んだ」のタグが自動で付く */
const APPLY_URL = "https://line-harness.alpha-a.workers.dev/t/e52d31fb-7119-464c-b72b-ec800a5218ae";

const TYPES = {
  craft:   {name:"こつこつ積み上げる職人",       color:"#3d96bd"},
  create:  {name:"思いついた日に動ける開拓者",   color:"#d9962e"},
  support: {name:"言葉になる前に気づける支え手", color:"#3aa87f"},
  attack:  {name:"自分から動ける先行者",         color:"#e07a63"}
};

function render(){
  const key = new URLSearchParams(location.search).get("type");
  const k = TYPES[key] ? key : "craft";
  const t = TYPES[k];

  document.documentElement.style.setProperty("--type", t.color);
  document.getElementById("imgFv").src = "./img/fv_" + k + ".jpg";
  document.getElementById("imgFv").alt = t.name;

  const btns = document.querySelectorAll(".cta-btn");
  for (let i = 0; i < btns.length; i++) btns[i].href = APPLY_URL;

  if (typeof fbq === "function") fbq("trackCustom", "ViewResultLP", {type: k});
  if (typeof clarity === "function") clarity("set", "result_type", k);
}

function trackApply(){
  if (typeof fbq === "function") fbq("trackCustom", "ClickApply");
}

/* 1画面ぶん読み進めたら下のバーを出す。最後の申し込みボタンが見えたら引っ込める */
function watchFixbar(){
  const bar = document.getElementById("fixbar");
  const last = document.querySelectorAll(".cta")[document.querySelectorAll(".cta").length - 1];
  let ticking = false;
  function update(){
    ticking = false;
    const passed = window.scrollY > window.innerHeight * 0.8;
    const lastTop = last.getBoundingClientRect().top;
    const lastVisible = lastTop < window.innerHeight - 60;
    bar.classList.toggle("on", passed && !lastVisible);
  }
  window.addEventListener("scroll", function(){
    if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
  }, {passive:true});
  update();
}

render();
watchFixbar();
</script>
